<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VELMINE — House Price Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & variables ──────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:   #e7e9e2;
    --sand:    #E8DFD0;
    --terracotta: #41569b;
    --terra-light: #d4632e;
    --terra-dark:  #ce5f2c;
    --charcoal: #2C2416;
    --mid:      #6B5D4E;
    --accent:   #4A7C59;
    --gold:     #B8963E;
    --white:    #FDFAF5;
    --shadow:   rgba(44,36,22,.12);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Noise texture overlay ──────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: .5;
  }

  /* ── Layout ─────────────────────────────────────────────────────────── */
  .page { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 3.5rem 0 2rem;
    animation: fadeDown .7s ease both;
  }

  .logo-mark {
    width: 56px; height: 56px; margin-bottom: 1rem;
    background: var(--terracotta);
    border-radius: 14px;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(196,103,58,.35);
  }

  .logo-mark svg { width: 30px; height: 30px; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 700; letter-spacing: -.02em;
    line-height: 1.1;
    color: var(--charcoal);
  }

  header h1 em { font-style: italic; color: var(--terracotta); }

  header p {
    margin-top: .75rem; font-size: 1.05rem; font-weight: 300;
    color: var(--mid); max-width: 480px;
  }

  /* ── Decorative divider ─────────────────────────────────────────────── */
  .divider {
    display: flex; align-items: center; gap: 1rem;
    margin: 2rem 0;
    animation: fadeIn .9s ease both .2s;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--sand); }
  .divider span { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--mid); }

  /* ── Card ────────────────────────────────────────────────────────────── */
  .card {
    background: var(--white);
    border-radius: 20px;
    border: 1px solid rgba(184,150,62,.2);
    box-shadow: 0 16px 64px var(--shadow), 0 2px 8px rgba(44,36,22,.06);
    padding: 2.5rem 2.5rem 2rem;
    animation: fadeUp .7s ease both .15s;
    position: relative; overflow: hidden;
  }

  /* top accent bar */
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--terracotta), var(--gold));
  }

  /* ── Form grid ───────────────────────────────────────────────────────── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem 1.6rem;
  }

  .form-group { display: flex; flex-direction: column; gap: .45rem; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: .72rem; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--mid);
  }

  .input-wrap { position: relative; }

  .input-wrap .unit {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: .8rem; color: var(--mid); pointer-events: none;
  }

  input, select {
    width: 100%; padding: .8rem 1rem;
    border: 1.5px solid var(--sand);
    border-radius: 10px;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: .95rem; color: var(--charcoal);
    transition: border-color .2s, box-shadow .2s, background .2s;
    outline: none;
    appearance: none;
  }

  input:focus, select:focus {
    border-color: var(--terracotta);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(196,103,58,.12);
  }

  input.has-unit { padding-right: 2.8rem; }

  /* custom select arrow */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--mid); pointer-events: none; font-size: .9rem;
  }

  /* ── Predict button ──────────────────────────────────────────────────── */
  .btn-predict {
    margin-top: 1.6rem; width: 100%;
    padding: 1rem 2rem;
    background: var(--terracotta);
    color: var(--white);
    border: none; border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 500;
    letter-spacing: .04em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    transition: background .25s, transform .15s, box-shadow .25s;
    box-shadow: 0 6px 20px rgba(196,103,58,.35);
    position: relative; overflow: hidden;
  }

  .btn-predict::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
    pointer-events: none;
  }

  .btn-predict:hover { background: var(--terra-dark); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(196,103,58,.45); }
  .btn-predict:active { transform: translateY(0); }
  .btn-predict:disabled { background: var(--mid); cursor: not-allowed; transform: none; box-shadow: none; }

  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite; display: none;
  }

  .btn-predict.loading .spinner { display: block; }
  .btn-predict.loading .btn-text { opacity: .7; }

  /* ── Result panel ────────────────────────────────────────────────────── */
  .result-panel {
    margin-top: 1.8rem; padding: 1.6rem 1.8rem;
    border-radius: 14px;
    background: linear-gradient(135deg, #F0EBE0 0%, var(--sand) 100%);
    border: 1px solid rgba(184,150,62,.25);
    display: none;
    animation: fadeUp .45s ease both;
  }

  .result-panel.visible { display: block; }
  .result-panel.error { background: #FDF0EC; border-color: rgba(196,103,58,.3); }

  .result-label {
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--mid); margin-bottom: .4rem;
  }

  .result-price {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1;
  }

  .result-price .currency { color: var(--terracotta); }

  .result-sub { margin-top: .5rem; font-size: .88rem; color: var(--mid); }

  .result-meta {
    margin-top: 1rem; padding-top: 1rem;
    border-top: 1px solid rgba(184,150,62,.2);
    display: flex; flex-wrap: wrap; gap: .5rem;
  }

  .tag {
    background: var(--white); border: 1px solid var(--sand);
    border-radius: 6px; padding: .25rem .65rem;
    font-size: .78rem; color: var(--mid);
  }

  .error-msg { color: var(--terra-dark); font-size: .92rem; }

  /* ── Info strip ──────────────────────────────────────────────────────── */
  .info-strip {
    margin-top: 1.8rem;
    display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem;
    animation: fadeIn .9s ease both .4s;
  }

  .info-card {
    background: var(--white); border-radius: 14px;
    border: 1px solid var(--sand);
    padding: 1.1rem 1.2rem;
    text-align: center;
  }

  .info-card .num {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem; color: var(--terracotta);
  }

  .info-card p { font-size: .78rem; color: var(--mid); margin-top: .2rem; }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  footer {
    text-align: center; margin-top: 3rem;
    font-size: .8rem; color: var(--mid);
    animation: fadeIn 1s ease both .6s;
  }

  /* ── Animations ──────────────────────────────────────────────────────── */
  @keyframes fadeDown  { from { opacity:0; transform: translateY(-18px) } to { opacity:1; transform: none } }
  @keyframes fadeUp    { from { opacity:0; transform: translateY(20px)  } to { opacity:1; transform: none } }
  @keyframes fadeIn    { from { opacity:0 } to { opacity:1 } }
  @keyframes spin      { to { transform: rotate(360deg) } }

  /* ── Responsive ──────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .card { padding: 1.8rem 1.2rem; }
    .info-strip { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- ── Header ── -->
  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 3L2 13h3v14h8v-8h4v8h8V13h3L15 3z" fill="white"/>
      </svg>
    </div>
    <h1>VELM<em>INE</em></h1>
    <p>Instant house price predictions powered by machine learning</p>
  </header>

  <div class="divider"><span>Enter Property Details</span></div>

  <!-- ── Prediction Card ── -->
  <div class="card">
    <div class="form-grid" id="form">

      <!-- Location -->
      <div class="form-group full">
        <label for="location">City / Location</label>
        <div class="select-wrap">
          <select id="location">
            <option value="">— Select city —</option>
            <option>Bangalore</option>
            <option>Chennai</option>
            <option>Delhi</option>
            <option>Hyderabad</option>
            <option>Mumbai</option>
            <option>Pune</option>
          </select>
        </div>
      </div>

      <!-- Square feet -->
      <div class="form-group">
        <label for="sqft">Built-up Area</label>
        <div class="input-wrap">
          <input type="number" id="sqft" placeholder="e.g. 1200" min="100" max="20000" class="has-unit" />
          <span class="unit">sq ft</span>
        </div>
      </div>

      <!-- BHK -->
      <div class="form-group">
        <label for="bhk">BHK</label>
        <div class="select-wrap">
          <select id="bhk">
            <option value="">— Select —</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
          </select>
        </div>
      </div>

      <!-- Bedrooms -->
      <div class="form-group">
        <label for="bedrooms">Bedrooms</label>
        <div class="select-wrap">
          <select id="bedrooms">
            <option value="">— Select —</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
          </select>
        </div>
      </div>

      <!-- Bathrooms -->
      <div class="form-group">
        <label for="bathrooms">Bathrooms</label>
        <div class="select-wrap">
          <select id="bathrooms">
            <option value="">— Select —</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option>
          </select>
        </div>
      </div>

    </div><!-- /form-grid -->

    <!-- Predict button -->
    <button class="btn-predict" id="predictBtn" onclick="predict()">
      <div class="spinner" id="spinner"></div>
      <span class="btn-text">Predict Price</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="btnIcon">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Result -->
    <div class="result-panel" id="result"></div>
  </div>

  <!-- ── Info strip ── -->
  <div class="info-strip">
    <div class="info-card">
      <div class="num">6</div>
      <p>Cities covered</p>
    </div>
    <div class="info-card">
      <div class="num">100+</div>
      <p>Training data points</p>
    </div>
    <div class="info-card">
      <div class="num">72%</div>
      <p>Model accuracy (R²)</p>
    </div>
  </div>

  <footer>
    GharMol · Linear Regression model · For estimation purposes only
  </footer>
</div>

<script>
const API = "";

async function predict() {
  const btn     = document.getElementById("predictBtn");
  const spinner = document.getElementById("spinner");
  const icon    = document.getElementById("btnIcon");
  const panel   = document.getElementById("result");

  // Gather values
  const location  = document.getElementById("location").value;
  const sqft      = document.getElementById("sqft").value;
  const bedrooms  = document.getElementById("bedrooms").value;
  const bathrooms = document.getElementById("bathrooms").value;
  const bhk       = document.getElementById("bhk").value;

  // Client-side validation
  if (!location || !sqft || !bedrooms || !bathrooms || !bhk) {
    showError("Please fill in all fields before predicting.");
    return;
  }
  if (parseFloat(sqft) <= 0) {
    showError("Square footage must be a positive number.");
    return;
  }

  // Loading state
  btn.disabled = true;
  btn.classList.add("loading");
  icon.style.display = "none";
  panel.className = "result-panel";

  try {
    const res = await fetch(`${API}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ location, sqft: +sqft, bedrooms: +bedrooms, bathrooms: +bathrooms, bhk: +bhk })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      showError(data.error || "Server error. Is the Flask API running?");
      return;
    }

    // Parse formatted price for display
    const raw       = data.predicted_price;
    const formatted = data.formatted_price;

    panel.innerHTML = `
      <div class="result-label">Estimated Market Price</div>
      <div class="result-price"><span class="currency">₹</span>${formatted.replace("₹", "")}</div>
      <div class="result-sub">≈ ₹${Math.round(raw / parseFloat(sqft)).toLocaleString("en-IN")} per sq ft</div>
      <div class="result-meta">
        <span class="tag">📍 ${data.input.location}</span>
        <span class="tag">📐 ${data.input.sqft.toLocaleString()} sq ft</span>
        <span class="tag">🛏 ${data.input.bedrooms} bed</span>
        <span class="tag">🚿 ${data.input.bathrooms} bath</span>
        <span class="tag">🏠 ${data.input.bhk} BHK</span>
      </div>
    `;
    panel.classList.add("visible");

  } catch (err) {
    showError("Could not connect to the API. Make sure the Flask server is running on port 5000.");
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    icon.style.display = "";
  }
}

function showError(msg) {
  const panel = document.getElementById("result");
  panel.className = "result-panel error visible";
  panel.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

// Allow Enter key on number input
document.getElementById("sqft").addEventListener("keydown", e => {
  if (e.key === "Enter") predict();
});
</script>
</body>
</html>
